name: olist-olap-lab

services:
  # ── ClickHouse: обязательная часть стенда ────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: olist_clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP  — curl / Metabase / clickhouse_connect
      - "9000:9000"   # native — clickhouse-client
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./ch-logs:/var/log/clickhouse-server
    healthcheck:
      # Локальный клиент надёжнее wget: бинарник есть в самом образе.
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # ── Metabase: профиль `bi`, нужен с З10 (дашборды) ──────────────────────
  # Поднимать: docker compose --profile bi up -d
  metabase:
    image: metabase/metabase:v0.52.4
    container_name: olist_metabase
    profiles: ["bi"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2                                  # файловая БД Metabase
      MB_DB_FILE: /metabase-data/metabase.db
      # Драйвер ClickHouse не входит в образ Metabase — он кладётся
      # в ./metabase-plugins и подключается как плагин.
      # Файл: clickhouse.metabase-driver.jar версии 1.52.0 (под Metabase 0.52.x).
      MB_PLUGINS_DIR: /plugins
    volumes:
      - metabase_data:/metabase-data
      - ./metabase-plugins:/plugins
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  ch_data:
  metabase_data: